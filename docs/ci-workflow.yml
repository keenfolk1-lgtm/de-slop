name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Doctor check
        run: node ./bin/de-slop.mjs doctor
      - name: Run unit and integration tests
        run: node --test ./test/*.test.mjs
      - name: Verify clean fixture passes score gate
        run: node ./bin/de-slop.mjs check ./fixtures/clean-pr.ts --max-score 10
